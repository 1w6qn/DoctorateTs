<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoctorateTs 管理后台</title>
<style>
  :root {
    --bg: #141414; --panel: #1e1e20; --border: #333;
    --gold: #d9a441; --text: #e8e6e3; --muted: #9a978f; --danger: #c0504d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; letter-spacing: 2px; color: var(--gold); }
  .status-pill { font-size: 12px; padding: 4px 10px; border-radius: 999px;
                 background: #2a2a2c; border: 1px solid var(--border); }
  .status-pill.online { color: #7ec699; border-color: #7ec699; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; }
  .full { grid-column: 1 / -1; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: normal; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover, tr.active { background: #26262a; }
  button { background: #333; color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button.primary { background: var(--gold); color: #141414; border-color: var(--gold); font-weight: bold; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: 2px 8px; font-size: 12px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6);
                display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 20px; width: 420px; max-width: 92vw; }
  .modal h3 { margin-bottom: 14px; color: var(--gold); }
  input, textarea, select { width: 100%; background: #111; color: var(--text); border: 1px solid var(--border);
                    border-radius: 6px; padding: 8px 10px; margin: 6px 0 12px; font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .row.wrap { flex-wrap: wrap; }
  #login { position: fixed; inset: 0; background: var(--bg); z-index: 99;
           display: flex; align-items: center; justify-content: center; }
  #login .box { width: 340px; }
  label { font-size: 12px; color: var(--muted); }
  /* Tab */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .tab { padding: 7px 16px; cursor: pointer; border-radius: 6px 6px 0 0;
         color: var(--muted); font-size: 13px; user-select: none; }
  .tab.active { background: #26262a; color: var(--gold); border: 1px solid var(--border); border-bottom: none; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  /* 统计 */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat-box { background: #1a1a1c; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-box .num { font-size: 20px; color: var(--gold); font-weight: bold; }
  .stat-box .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dist-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .bar-row .k { width: 64px; color: var(--muted); text-align: right; }
  .bar { background: #2a2a2c; height: 12px; border-radius: 4px; overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; background: var(--gold); min-width: 2px; }
  .bar-row .v { width: 36px; color: var(--muted); }
  /* JSON / 日志 */
  pre.json { background: #111; padding: 12px; border-radius: 6px; overflow: auto;
             max-height: 460px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .log-list { max-height: 220px; overflow: auto; font-size: 12px; color: var(--muted); }
  .log-list div { padding: 4px 0; border-bottom: 1px solid #26262a; }
  .log-list b { color: var(--text); }
  .mini-input { width: 58px; padding: 4px 6px; margin: 2px; display: inline-block; }
  .hint { font-size: 11px; color: var(--muted); margin: -6px 0 10px; }
  /* 接口控制台 */
  .sub-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .console { display: grid; grid-template-columns: 300px 1fr; gap: 12px; }
  .console .req-col { display: flex; flex-direction: column; gap: 4px; }
  .api-list { max-height: 440px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
  .api-item { padding: 6px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #26262a; }
  .api-item:hover, .api-item.active { background: #26262a; }
  .api-item .p { color: var(--gold); font-family: Consolas, monospace; }
  .api-item .s { color: var(--muted); }
  .m-chip { display: inline-block; min-width: 42px; text-align: center; padding: 1px 6px;
            border-radius: 4px; font-size: 11px; margin-right: 6px; font-weight: bold; }
  .m-GET { background: #1f3a2a; color: #7ec699; }
  .m-POST { background: #3a2f1f; color: var(--gold); }
  .m-DELETE { background: #3a1f1f; color: #e08b8b; }
  .resp-box { background: #111; border: 1px solid var(--border); border-radius: 6px; padding: 10px;
              font-size: 12px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all;
              font-family: Consolas, monospace; }
</style>
</head>
<body>
<!-- 登录层 -->
<div id="login">
  <div class="card box">
    <h1 style="color:var(--gold);margin-bottom:16px;">DoctorateTs 管理后台</h1>
    <label>管理令牌（data/config.json 中 admin.token）</label>
    <input id="login-token" type="password" placeholder="请输入管理令牌">
    <button class="primary" id="login-btn" style="width:100%;">进入后台</button>
    <p id="login-err" style="color:var(--danger);margin-top:8px;display:none;">令牌无效或管理接口未启用</p>
  </div>
</div>

<header>
  <h1>DOCTORATETS 管理后台</h1>
  <span class="status-pill" id="pill-offline">离线模式</span>
  <span class="status-pill">端口 <span id="pill-port">-</span></span>
  <span class="status-pill">用户 <span id="pill-users">-</span></span>
  <span style="margin-left:auto;font-size:12px;color:var(--muted);" id="pill-uptime"></span>
  <button id="logout-btn">退出</button>
</header>

<main>
  <!-- 统计 -->
  <section class="card full">
    <h3 style="color:var(--gold);margin-bottom:12px;">统计</h3>
    <div class="stat-grid" id="stats-grid"></div>
    <div class="dist-col" style="margin-top:14px;">
      <div>
        <label>等级分布</label>
        <div id="stats-level-dist"></div>
      </div>
      <div>
        <label>注册时间分布（按月）</label>
        <div id="stats-register-dist"></div>
      </div>
    </div>
  </section>

  <!-- 左侧：用户列表 -->
  <section class="card">
    <div class="row" style="align-items:center;margin-bottom:10px;">
      <h3 style="color:var(--gold);">用户列表</h3>
      <button class="primary" id="btn-create" style="margin-left:auto;">+ 创建用户</button>
    </div>
    <input id="user-filter" placeholder="搜索 uid/昵称/手机号..." style="margin:0 0 10px;">
    <table>
      <thead><tr><th>UID</th><th>昵称</th><th>等级</th><th>手机</th><th>最后在线</th><th></th></tr></thead>
      <tbody id="user-tbody"></tbody>
    </table>
    <p id="user-empty" style="color:var(--muted);text-align:center;padding:20px;">暂无用户</p>
  </section>

  <!-- 右侧：详情/操作 -->
  <section class="card" id="detail-card">
    <h3 style="color:var(--gold);" id="detail-title">用户详情</h3>
    <div id="detail-empty" style="color:var(--muted);padding:20px 0;text-align:center;">点击左侧用户查看详情</div>
    <div id="detail-body" style="display:none;">
      <div class="tabs">
        <div class="tab active" data-tab="overview">概览</div>
        <div class="tab" data-tab="chars">干员</div>
        <div class="tab" data-tab="mails">邮件</div>
        <div class="tab" data-tab="pools">卡池</div>
        <div class="tab" data-tab="api">接口</div>
        <div class="tab" data-tab="migrate">迁移</div>
        <div class="tab" data-tab="raw">数据</div>
      </div>
      <div class="tab-pane active" id="pane-overview"></div>
      <div class="tab-pane" id="pane-chars"></div>
      <div class="tab-pane" id="pane-mails"></div>
      <div class="tab-pane" id="pane-pools"></div>
      <div class="tab-pane" id="pane-api"></div>
      <div class="tab-pane" id="pane-migrate"></div>
      <div class="tab-pane" id="pane-raw"></div>
    </div>
  </section>

  <!-- 操作日志 -->
  <section class="card full">
    <div class="row" style="align-items:center;margin-bottom:10px;">
      <h3 style="color:var(--gold);">操作日志</h3>
      <button id="btn-refresh-logs" class="btn-sm" style="margin-left:auto;">刷新</button>
    </div>
    <div class="log-list" id="logs-list"><span style="color:var(--muted);">暂无操作日志</span></div>
  </section>
</main>

<!-- 弹窗：发放物品 -->
<div class="modal-mask" id="modal-grant">
  <div class="modal">
    <h3>发放物品 — <span id="grant-uid"></span></h3>
    <label>物品 ID 或中文名（如 4001=龙门币、4003=合成玉、"合成玉"）</label>
    <input id="grant-item" placeholder="4001 或 合成玉">
    <label>搜索物品（按名称/ID，点击结果填入）</label>
    <input id="grant-search" placeholder="输入关键字搜索...">
    <div id="grant-search-results" style="max-height:130px;overflow:auto;font-size:12px;margin-bottom:6px;"></div>
    <label>数量</label>
    <input id="grant-count" type="number" value="1" min="1">
    <div class="row">
      <button id="grant-cancel">取消</button>
      <button class="primary" id="grant-ok">发放</button>
      <button id="grant-all-btn">全部物品</button>
    </div>
  </div>
</div>

<!-- 弹窗：发送邮件 -->
<div class="modal-mask" id="modal-mail">
  <div class="modal">
    <h3>发送邮件 — <span id="mail-uid"></span></h3>
    <label><input type="checkbox" id="mail-all" style="width:auto;margin:0 4px 0 0;vertical-align:middle;">发送给所有用户</label>
    <label>标题</label>
    <input id="mail-subject" placeholder="邮件标题">
    <label>内容</label>
    <textarea id="mail-content" rows="3" placeholder="邮件正文"></textarea>
    <label>附件（id:count，逗号分隔，如 4001:100,4003:10）</label>
    <input id="mail-items" placeholder="4001:100,4003:10">
    <div class="row">
      <button id="mail-cancel">取消</button>
      <button class="primary" id="mail-ok">发送</button>
    </div>
  </div>
</div>

<!-- 弹窗：创建用户 -->
<div class="modal-mask" id="modal-create">
  <div class="modal">
    <h3>创建用户</h3>
    <label>手机号</label>
    <input id="create-phone" placeholder="13800000000">
    <label>密码（留空默认同手机号）</label>
    <input id="create-password" placeholder="123456">
    <div class="row">
      <button id="create-cancel">取消</button>
      <button class="primary" id="create-ok">创建</button>
    </div>
  </div>
</div>

<!-- 弹窗：发放干员 -->
<div class="modal-mask" id="modal-char">
  <div class="modal">
    <h3>发放干员 — <span id="char-uid"></span></h3>
    <label>干员 ID 或中文名（如 char_002_amiya 或 阿米娅）</label>
    <input id="char-id" placeholder="char_002_amiya">
    <p class="hint">重复干员将按稀有度折算为信物与高级/资质凭证</p>
    <div class="row">
      <button id="char-cancel">取消</button>
      <button class="primary" id="char-ok">发放</button>
    </div>
  </div>
</div>

<!-- 弹窗：干员详情 -->
<div class="modal-mask" id="modal-charinfo">
  <div class="modal" style="width:520px;">
    <h3 id="charinfo-title">干员详情</h3>
    <div id="charinfo-body" style="font-size:12px;color:var(--muted);">加载中...</div>
    <div class="row">
      <button id="charinfo-close" style="margin-left:auto;">关闭</button>
    </div>
  </div>
</div>

<!-- 弹窗：解锁皮肤 -->
<div class="modal-mask" id="modal-skin">
  <div class="modal">
    <h3>解锁皮肤 — <span id="skin-uid"></span></h3>
    <label>皮肤 ID（如 char_002_amiya#2）</label>
    <input id="skin-id" placeholder="char_002_amiya#2">
    <div class="row">
      <button id="skin-cancel">取消</button>
      <button class="primary" id="skin-ok">解锁</button>
    </div>
  </div>
</div>

<script>
/* DoctorateTs 管理后台交互逻辑（原生 JS，零依赖） */
(function () {
  "use strict";
  var API = "/admin/api";
  var token = localStorage.getItem("adminToken") || "";
  var selectedUid = null;
  var selectedPoolId = null;
  var userFilter = "";
  var currentTab = "overview";

  function api(path, options) {
    options = options || {};
    var headers = { "X-Admin-Token": token };
    if (options.headers) Object.assign(headers, options.headers);
    if (options.body) headers["Content-Type"] = "application/json";
    return fetch(API + path, Object.assign({}, options, { headers: headers }))
      .then(function (res) {
        if (res.status === 401 || res.status === 403) {
          throw new Error("认证失败");
        }
        return res.json().then(function (data) {
          if (!res.ok) throw new Error(data.error || "请求失败(" + res.status + ")");
          return data;
        });
      });
  }

  function fmtTs(ts) { return ts ? new Date(ts * 1000).toLocaleString() : "-"; }
  function $(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- 状态 / 用户列表 ---------- */

  function refreshStatus() {
    return api("/status").then(function (st) {
      $("pill-offline").textContent = st.offline ? "离线模式" : "在线模式";
      $("pill-offline").className = "status-pill" + (st.offline ? "" : " online");
      $("pill-port").textContent = st.port;
      $("pill-users").textContent = st.userCount;
      $("pill-uptime").textContent = "运行 " + Math.floor(st.uptime / 60) + " 分钟";
    }).catch(function () {});
  }

  function refreshUsers() {
    return api("/users?filter=" + encodeURIComponent(userFilter)).then(function (users) {
      var tbody = $("user-tbody");
      tbody.innerHTML = "";
      $("user-empty").style.display = users.length ? "none" : "block";
      users.forEach(function (u) {
        var tr = document.createElement("tr");
        tr.className = "clickable";
        if (u.uid === selectedUid) tr.classList.add("active");
        tr.innerHTML =
          "<td>" + u.uid + "</td><td>" + escapeHtml(u.nickName) + "</td><td>" + u.level + "</td>" +
          "<td>" + escapeHtml(u.phone || "-") + "</td><td>" + fmtTs(u.lastOnlineTs) + "</td>" +
          "<td><button data-grant=\"" + u.uid + "\" class=\"btn-sm\">发物品</button> " +
          "<button data-mail=\"" + u.uid + "\" class=\"btn-sm\">发邮件</button></td>";
        tr.querySelector("[data-grant]").addEventListener("click", function (e) {
          e.stopPropagation();
          openGrant(u.uid);
        });
        tr.querySelector("[data-mail]").addEventListener("click", function (e) {
          e.stopPropagation();
          openMail(u.uid);
        });
        tr.addEventListener("click", function () { selectUser(u.uid); });
        tbody.appendChild(tr);
      });
    }).catch(function () {});
  }

  /* ---------- 统计 / 日志 ---------- */

  function refreshStats() {
    return api("/stats").then(function (s) {
      $("stats-grid").innerHTML =
        statBox(s.userCount, "用户数") + statBox(s.totalChars, "干员总数") +
        statBox(fmtNum(s.totalGold), "龙门币合计") + statBox(fmtNum(s.totalDiamond), "合成玉合计") +
        statBox(s.avgLevel, "平均等级");
      $("stats-level-dist").innerHTML = distBars(s.levelDist);
      $("stats-register-dist").innerHTML = distBars(s.registerDist);
    }).catch(function () {});
  }

  function statBox(num, lbl) {
    return '<div class="stat-box"><div class="num">' + escapeHtml(num) + '</div>' +
           '<div class="lbl">' + escapeHtml(lbl) + "</div></div>";
  }

  function fmtNum(n) {
    return n >= 100000000 ? (n / 100000000).toFixed(1) + "亿" :
           n >= 10000 ? (n / 10000).toFixed(1) + "万" : String(n);
  }

  function distBars(dist) {
    var keys = Object.keys(dist || {}).sort();
    if (!keys.length) return '<span style="color:var(--muted);">暂无数据</span>';
    var max = Math.max.apply(null, keys.map(function (k) { return dist[k]; }));
    return keys.map(function (k) {
      var w = Math.max(2, Math.round(dist[k] / max * 100));
      return '<div class="bar-row"><span class="k">' + escapeHtml(k) + "</span>" +
             '<span class="bar"><i style="width:' + w + '%"></i></span>' +
             '<span class="v">' + dist[k] + "</span></div>";
    }).join("");
  }

  function refreshLogs() {
    return api("/logs?limit=50").then(function (entries) {
      var box = $("logs-list");
      if (!entries.length) {
        box.innerHTML = '<span style="color:var(--muted);">暂无操作日志</span>';
        return;
      }
      box.innerHTML = entries.map(function (e) {
        return "<div><b>[" + fmtTs(e.ts) + "]</b> " + escapeHtml(e.action) +
               " uid=" + escapeHtml(e.uid || "-") + " — " + escapeHtml(e.detail) + "</div>";
      }).join("");
    }).catch(function () {});
  }

  /* ---------- 用户详情（Tab） ---------- */

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll("#detail-body .tab").forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-tab") === tab);
    });
    document.querySelectorAll("#detail-body .tab-pane").forEach(function (p) {
      p.classList.toggle("active", p.id === "pane-" + tab);
    });
    if (selectedUid) loadPane(tab, selectedUid);
  }

  function loadPane(tab, uid) {
    if (tab === "overview") loadOverview(uid);
    else if (tab === "chars") loadChars(uid);
    else if (tab === "mails") loadMails(uid);
    else if (tab === "pools") loadPoolsPane();
    else if (tab === "api") loadApiPane();
    else if (tab === "migrate") loadMigratePane();
    else if (tab === "raw") loadRaw(uid);
  }

  function selectUser(uid) {
    selectedUid = uid;
    $("detail-title").textContent = "用户详情 — " + uid;
    $("detail-empty").style.display = "none";
    $("detail-body").style.display = "block";
    refreshUsers();
    loadPane(currentTab, uid);
  }

  function loadOverview(uid) {
    api("/users/" + encodeURIComponent(uid)).then(function (info) {
      var inv = (info.inventoryInfo || []).slice(0, 20)
        .map(function (it) { return escapeHtml(it.name) + "(" + escapeHtml(it.id) + ") x" + it.count; })
        .join("<br>") || "（空）";
      $("pane-overview").innerHTML =
        "<p><b>" + escapeHtml(info.nickName) + "#" + escapeHtml(info.nickNumber) + "</b> Lv." + info.level + "</p>" +
        "<p style=\"color:var(--muted);margin-top:6px;\">UID " + info.uid + " | 注册 " + fmtTs(info.registerTs) +
        " | 最后在线 " + fmtTs(info.lastOnlineTs) + "</p>" +
        '<div class="row wrap" style="gap:8px;margin:12px 0;">' +
        '<button id="act-maxout" class="primary">一键满配</button>' +
        '<button id="act-building">基建满级</button>' +
        '<button id="act-refresh">每日刷新</button>' +
        '<button id="act-save">保存</button>' +
        '<button id="act-backup">备份</button>' +
        '<button id="act-restore">恢复最近备份</button>' +
        '<button id="btn-char">发干员</button>' +
        '<button id="btn-skin">发皮肤</button></div>' +
        "<table>" +
        "<tr><td>龙门币</td><td>" + fmtNum(info.gold) + "</td><td>合成玉</td><td>" + fmtNum(info.androidDiamond) + "</td></tr>" +
        "<tr><td>寻访凭证</td><td>" + info.gachaTicket + "</td><td>招募许可</td><td>" + info.recruitLicense + "</td></tr>" +
        "<tr><td>演习券</td><td>" + info.practiceTicket + "</td><td>经验</td><td>" + info.exp + "</td></tr>" +
        "<tr><td>干员数</td><td>" + info.charCnt + "</td><td></td><td></td></tr>" +
        "</table>" +
        "<h4 style=\"color:var(--gold);margin:12px 0 6px;\">背包道具（前 20）</h4>" +

  function bindOverviewActions(uid) {
    var act = {
      "act-maxout": { path: "/maxout", label: "一键满配" },
      "act-building": { path: "/building-max", label: "基建满级" },
      "act-refresh": { path: "/refresh", label: "每日刷新" },
      "act-save": { path: "/save", label: "保存" },
      "act-backup": { path: "/backup", label: "备份" },
    };
    Object.keys(act).forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.addEventListener("click", function () {
        var conf = act[id];
        el.disabled = true;
        api("/users/" + encodeURIComponent(uid) + conf.path, { method: "POST", body: "{}" })
          .then(function (r) {
            var msg = id === "act-backup" ? "已备份：" + r.name : "操作成功" + (r.rooms != null ? "（" + r.rooms + " 间房间）" : "");
            if (id === "act-maxout" && r.chars != null) msg = "满配完成：干员 " + r.chars + " | 物品 " + r.items + " | 皮肤 " + r.skins + " | 基建 " + r.rooms;
            alert(conf.label + "成功 — " + msg);
            loadOverview(uid);
            refreshLogs();
          })
          .catch(function (e) { alert(conf.label + "失败：" + e.message); })
          .finally(function () { el.disabled = false; });
      });
    });
    var restoreBtn = $("act-restore");
    if (restoreBtn) {
      restoreBtn.addEventListener("click", function () {
        api("/users/" + encodeURIComponent(uid) + "/backups").then(function (list) {
          if (!list.length) { alert("暂无备份"); return; }
          var b = list[0];
          if (!confirm("将从 " + b.name + "（" + fmtTs(b.ts) + "）恢复，覆盖当前存档，确认？")) return;
          api("/users/" + encodeURIComponent(uid) + "/restore", {
            method: "POST", body: JSON.stringify({ backup: b.name }),
          }).then(function () {
            alert("已恢复：" + b.name);
            loadOverview(uid);
            refreshLogs();
          }).catch(function (e) { alert("恢复失败：" + e.message); });
        });
      });
    }
    $("btn-char").addEventListener("click", function () { openChar(uid); });
    $("btn-skin").addEventListener("click", function () { openSkin(uid); });
  }

  function renderApiList(endpoints, filter) {
    var box = $("api-list");
    var kw = filter.toLowerCase();
    var items = endpoints.filter(function (e) {
      return (e.method + " " + e.path + " " + (e.summary || "")).toLowerCase().indexOf(kw) !== -1;
    });
    box.innerHTML = items.map(function (e) {
      return '<div class="api-item" data-p="' + e.path + '">' + chip(e.method) +
        '<span class="p">' + escapeHtml(e.path) + "</span><br>" +
        '<span class="s">' + escapeHtml(e.summary || "") + "</span></div>";
    }).join("") || '<div style="padding:10px;color:var(--muted);">无匹配端点</div>';
    document.querySelectorAll("#api-list .api-item").forEach(function (el) {
      el.addEventListener("click", function () {
        var path = el.getAttribute("data-p");
        var spec = endpoints.find(function (e) { return e.path === path; });
        loadIntoBuilder(spec);
        document.querySelectorAll("#api-list .api-item").forEach(function (x) {
          x.classList.remove("active");
        });
        el.classList.add("active");
      });
    });
  }

  function loadIntoBuilder(spec) {
    $("req-method").value = spec.method;
    var path = spec.path;
    // :uid 用当前选中用户预填，其余路径参数留给用户编辑
    if (selectedUid && path.indexOf(":uid") !== -1) {
      path = path.split(":uid").join(selectedUid);
    }
    $("req-path").value = path;
    $("req-body").value = spec.body || "";
    var hint = "";
    if (spec.params && spec.params.length) {
      hint = "参数：" + spec.params.map(function (p) {
        return (p.required ? "*" : "") + p.name + "(" + p.type + ") " + p.desc;
      }).join("；");
    }
    $("req-body").setAttribute("placeholder", hint || "{}");
  }

  function sendAdminReq() {
    var method = $("req-method").value;
    var path = $("req-path").value.trim();
    if (!path) { alert("请填写路径"); return; }
    var bodyRaw = $("req-body").value.trim();
    var options = { method: method };
    if (bodyRaw) {
      try {
        options.body = JSON.stringify(JSON.parse(bodyRaw));
      } catch (e) {
        alert("请求体不是合法 JSON"); return;
      }
    }
    $("req-resp").textContent = "请求中...";
    // 管理端点路径已含 /api 前缀（挂在 /admin 下）
    fetch("/admin" + path, Object.assign({}, options, {
      headers: { "X-Admin-Token": token, "Content-Type": "application/json" },
    }))
      .then(function (res) {
        return res.text().then(function (txt) {
          var pretty;
          try { pretty = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) { pretty = txt; }
          $("req-resp").textContent = "HTTP " + res.status + "\n" + pretty;
        });
      })
      .catch(function (e) { $("req-resp").textContent = "请求失败: " + e.message; });
  }

        return { id: p[0], count: Number(p[1] || 1) };
      });
    if (!subject) { alert("请填写标题"); return; }
    var req = toAll
      ? api("/mail/all", { method: "POST", body: JSON.stringify({ subject: subject, content: content, items: items }) })
        .then(function (r) { return "已群发给 " + r.sent + " 个用户"; })
      : api("/mail", { method: "POST", body: JSON.stringify({ uid: uid, subject: subject, content: content, items: items }) })
        .then(function (r) { return "邮件已发送，mailId=" + r.mailId; });
    req.then(function (msg) {
      hideModal("modal-mail");
      alert(msg);
      refreshLogs();
    }).catch(function (e) { alert("发送失败：" + e.message); });
  });
  $("mail-cancel").addEventListener("click", function () { hideModal("modal-mail"); });

  $("btn-create").addEventListener("click", function () {
    $("create-phone").value = "";
    $("create-password").value = "";
    showModal("modal-create");
  });
  $("create-ok").addEventListener("click", function () {
    var phone = $("create-phone").value.trim();
    var password = $("create-password").value || phone;
    if (!phone) { alert("请填写手机号"); return; }
    api("/users", {
      method: "POST",
      body: JSON.stringify({ phone: phone, password: password }),
    }).then(function (r) {
      hideModal("modal-create");
      alert("已创建用户 uid=" + r.uid);
      refreshUsers();
      refreshStats();
      refreshLogs();
    }).catch(function (e) { alert("创建失败：" + e.message); });
  });
  $("create-cancel").addEventListener("click", function () { hideModal("modal-create"); });

  function openChar(uid) {
    $("char-uid").textContent = uid;
    $("char-id").value = "";
    showModal("modal-char");
  }
  $("char-ok").addEventListener("click", function () {
    var uid = $("char-uid").textContent;
    var charId = $("char-id").value.trim();
    if (!charId) { alert("请填写干员 ID 或名称"); return; }
    api("/users/" + encodeURIComponent(uid) + "/grantchar", {
      method: "POST", body: JSON.stringify({ charId: charId }),
    }).then(function (r) {
      hideModal("modal-char");
      alert("干员发放成功：" + r.name + "（" + (r.isNew ? "新干员" : "重复") + "）");
      loadOverview(uid);
      refreshLogs();
    }).catch(function (e) { alert("发放失败：" + e.message); });
  });
  $("char-cancel").addEventListener("click", function () { hideModal("modal-char"); });

  function openSkin(uid) {
    $("skin-uid").textContent = uid;
    $("skin-id").value = "";
    showModal("modal-skin");
  }
  $("skin-ok").addEventListener("click", function () {
    var uid = $("skin-uid").textContent;
    var skinId = $("skin-id").value.trim();
    if (!skinId) { alert("请填写皮肤 ID"); return; }
    api("/users/" + encodeURIComponent(uid) + "/grantskin", {
      method: "POST", body: JSON.stringify({ skinId: skinId }),
    }).then(function () {
      hideModal("modal-skin");
      alert("皮肤解锁成功：" + skinId);
      refreshLogs();
    }).catch(function (e) { alert("解锁失败：" + e.message); });
  });
  $("skin-cancel").addEventListener("click", function () { hideModal("modal-skin"); });

  /* ---------- 卡池 Tab ---------- */

  function loadPoolsPane() {
    var pane = $("pane-pools");
    pane.innerHTML =
      '<div class="console">' +
      '<div><input id="pool-filter" placeholder="过滤卡池...">' +
      '<div class="api-list" id="pool-list"></div></div>' +
      '<div id="pool-detail" style="color:var(--muted);padding:10px 0;">点击左侧卡池查看详情</div></div>';
    api("/pools").then(function (pools) {
      renderPoolList(pools, "");
      $("pool-filter").addEventListener("input", function () {
        renderPoolList(pools, this.value);
      });
      if (selectedPoolId) selectPool(selectedPoolId);
    }).catch(function () {});
  }

  function renderPoolList(pools, filter) {
    var box = $("pool-list");
    var kw = filter.toLowerCase();
    var items = pools.filter(function (p) {
      return (p.poolId + " " + p.name).toLowerCase().indexOf(kw) !== -1;
    });
    box.innerHTML = items.map(function (p) {
      return '<div class="api-item" data-id="' + p.poolId + '">' +
        '<span class="p">' + escapeHtml(p.poolId) + "</span> " + escapeHtml(p.name) + "<br>" +
        '<span class="s">[' + escapeHtml(p.ruleType) + "] 保底 " + p.guarantee5Count +
        " | " + fmtTs(p.openTime) + " ~ " + fmtTs(p.endTime) + "</span></div>";
    }).join("") || '<div style="padding:10px;color:var(--muted);">无匹配卡池</div>';
    document.querySelectorAll("#pool-list .api-item").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        selectedPoolId = id;
        selectPool(id);
        document.querySelectorAll("#pool-list .api-item").forEach(function (x) {
          x.classList.remove("active");
        });
        el.classList.add("active");
      });
    });
  }

  function selectPool(poolId) {
    api("/pools/" + encodeURIComponent(poolId)).then(function (d) {
      var upHtml = d.upChars.length
        ? d.upChars.map(function (c) { return escapeHtml(c.name) + "(" + escapeHtml(c.charId) + ") " + c.percent + "%"; }).join("<br>")
        : "（无）";
      $("pool-detail").innerHTML =
        "<h4 style=\"color:var(--gold);\">" + escapeHtml(d.name) +
        " <span style=\"color:var(--muted);font-size:12px;\">" + escapeHtml(d.poolId) + " [" + escapeHtml(d.ruleType) + "]</span></h4>" +
        "<p style=\"color:var(--muted);font-size:12px;\">保底 " + d.guarantee5Count + " | 开池 " + fmtTs(d.openTime) + " ~ " + fmtTs(d.endTime) + "</p>" +
        "<table>" +
        "<tr><td>UP 干员</td><td>" + upHtml + "</td></tr>" +
        "<tr><td>可用干员</td><td>" + d.availChars.length + " 名</td></tr>" +
        "<tr><td>限时干员</td><td>" + d.limitedChars.length + " 名</td></tr>" +
        "</table>" +
        '<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">' +
        (selectedUid
          ? '<label>玩家 <b style="color:var(--text);">' + escapeHtml(selectedUid) + "</b> 的卡池状态</label><div id=\"pool-state\"></div>"
          : '<p style="color:var(--muted);">← 先在左侧用户列表选择用户，可管理其卡池状态</p>') +
        "</div>";
      if (selectedUid) loadPoolState(selectedUid, poolId);
    }).catch(function () {});
  }

  function loadPoolState(uid, poolId) {
    api("/users/" + encodeURIComponent(uid) + "/pools/" + encodeURIComponent(poolId)).then(function (st) {
      $("pool-state").innerHTML =
        '<div class="row" style="align-items:center;margin:8px 0;"><span style="color:var(--muted);font-size:12px;">当前 UP: ' +
        (st.upChars.length ? st.upChars.map(function (c) { return escapeHtml(c.name); }).join(", ") : "（未选择）") +
        " | 保底: " + st.beforeNonHitCnt + " / " + st.guarantee5Count + "</span></div>" +
        "<label>设置 UP（干员 ID 或中文名，逗号分隔；留空清除）</label>" +
        '<input id="pool-up-input" placeholder="char_002_amiya, 阿米娅" value="' + escapeHtml(st.upCharIds.join(", ")) + '">' +
        '<div class="row">' +
        '<input id="pool-pity-rule" placeholder="规则类型" value="' + escapeHtml(st.ruleType) + '" style="flex:0 0 120px;">' +
        '<input id="pool-pity-count" type="number" placeholder="保底计数" value="' + st.beforeNonHitCnt + '" min="0"></div>' +
        '<div class="row"><button id="pool-up-save" class="primary">保存 UP</button>' +
        '<button id="pool-pity-save">保存保底</button></div>';
      $("pool-up-save").addEventListener("click", function () {
        var charIds = ($("pool-up-input").value || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        api("/users/" + encodeURIComponent(uid) + "/pools/" + encodeURIComponent(poolId) + "/up", {
          method: "POST", body: JSON.stringify({ charIds: charIds }),
        }).then(function () {
          alert("UP 已更新");
          selectPool(poolId);
          refreshLogs();
        }).catch(function (e) { alert("设置失败：" + e.message); });
      });
      $("pool-pity-save").addEventListener("click", function () {
        api("/users/" + encodeURIComponent(uid) + "/pity", {
          method: "POST",
          body: JSON.stringify({
            ruleType: $("pool-pity-rule").value.trim(),
            count: Number($("pool-pity-count").value),
          }),
        }).then(function () {
          alert("保底已更新");
          selectPool(poolId);
          refreshLogs();
        }).catch(function (e) { alert("设置失败：" + e.message); });
      });
    }).catch(function () {});
  }

  /* ---------- 迁移 Tab（官服账号转移） ---------- */

  function loadMigratePane() {
    var pane = $("pane-migrate");
    pane.innerHTML =
      '<p style="color:var(--muted);font-size:12px;">官服账号迁移：服务器联网拉取官服数据（官方服务器），转换后注册为私服账号，' +
      "新用户自动加载。<br>格式：每行「手机号 密码」，或两行一组「手机号\\n密码」；空行/备注行忽略。</p>" +
      "<label>账号内容</label>" +
      '<textarea id="migrate-accounts" rows="8" placeholder="13800000000 password123&#10;13900000000&#10;pwd456"></textarea>' +
      '<div class="row">' +
      '<input id="migrate-template" placeholder="模板 uid" value="1" style="flex:0 0 140px;">' +
      '<button id="migrate-run" class="primary">执行迁移</button></div>' +
      '<div class="resp-box" id="migrate-resp" style="margin-top:10px;">结果显示在此</div>';
    $("migrate-run").addEventListener("click", runMigrate);
  }

  function runMigrate() {
    var accounts = $("migrate-accounts").value;
    var templateUid = $("migrate-template").value.trim() || "1";
    if (!accounts.trim()) { alert("请粘贴账号内容"); return; }
    $("migrate-resp").textContent = "迁移中...（需联网访问官服，逐账号执行，请耐心等待）";
    api("/official/migrate", {
      method: "POST",
      body: JSON.stringify({ accounts: accounts, templateUid: templateUid }),
    }).then(function (r) {
      var results = r.results || [];
      var ok = results.filter(function (x) { return !x.error; }).length;
      var lines = results.map(function (x) {
        return x.error
          ? "[失败] " + x.phone + ": " + x.error
          : "[成功] " + x.phone + " → uid=" + x.uid + " 昵称=" + (x.nickName || "");
      });
      $("migrate-resp").textContent = "迁移完成：" + ok + "/" + results.length + " 成功\n" + lines.join("\n");
      refreshUsers();
      refreshStats();
      refreshLogs();
    }).catch(function (e) {
      $("migrate-resp").textContent = "迁移失败: " + e.message;
    });
  }

  /* ---------- 登录 ---------- */

  function showLogin() { $("login").style.display = "flex"; }
  function hideLogin() { $("login").style.display = "none"; }
  if (token) hideLogin(); else showLogin();

  $("login-btn").addEventListener("click", function () {
    token = $("login-token").value.trim();
    api("/status").then(function () {
      localStorage.setItem("adminToken", token);
      hideLogin();
      refreshAll();
    }).catch(function () {
      $("login-err").style.display = "block";
    });
  });
  $("login-token").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("login-btn").click();
  });
  $("logout-btn").addEventListener("click", function () {
    token = "";
    localStorage.removeItem("adminToken");
    selectedUid = null;
    selectedPoolId = null;
    userFilter = "";
    currentTab = "overview";
    showLogin();
  });

  /* 用户搜索：输入即过滤，轮询保持 filter */
  $("user-filter").addEventListener("input", function () {
    userFilter = this.value.trim();
    refreshUsers();
  });

  /* ---------- Tab 切换 ---------- */

  document.querySelectorAll("#detail-body .tab").forEach(function (t) {
    t.addEventListener("click", function () { switchTab(t.getAttribute("data-tab")); });
  });
  $("btn-refresh-logs").addEventListener("click", refreshLogs);

  /* ---------- 轮询 ---------- */

  function refreshAll() {
    refreshStatus();
    refreshUsers();
    refreshStats();
    refreshLogs();
  }

  refreshAll();
  setInterval(refreshAll, 10000);
})();
</script>
</body>
</html>
