<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoctorateTs 管理后台</title>
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/admin/icon.svg">
<style>
  :root {
    --bg: #141414; --panel: #1e1e20; --border: #333;
    --gold: #d9a441; --text: #e8e6e3; --muted: #9a978f; --danger: #c0504d;
    --panel2: #1a1a1c; --hover: #26262a; --input: #111; --bar: #2a2a2c;
    --ok: #7ec699; --warn: #d9a441; --err: #e08b8b; --star5: #b28ae0; --star4: #7ec699;
  }
  /* 浅色主题 */
  [data-theme="light"] {
    --bg: #f4f3f1; --panel: #ffffff; --border: #d9d7d2; --gold: #a67c00;
    --text: #262626; --muted: #777; --danger: #c0392b;
    --panel2: #f0efec; --hover: #e9e8e5; --input: #ffffff; --bar: #e3e1dc;
    --ok: #2e8b57; --err: #c0392b; --star5: #7b4fc0; --star4: #2e8b57;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; letter-spacing: 2px; color: var(--gold); }
  .status-pill { font-size: 12px; padding: 4px 10px; border-radius: 999px;
                 background: var(--bar); border: 1px solid var(--border); }
  .status-pill.online { color: #7ec699; border-color: #7ec699; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; }
  .full { grid-column: 1 / -1; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: normal; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover, tr.active { background: var(--hover); }
  button { background: #333; color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button.primary { background: var(--gold); color: #141414; border-color: var(--gold); font-weight: bold; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: 2px 8px; font-size: 12px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6);
                display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 20px; width: 420px; max-width: 92vw; }
  .modal h3 { margin-bottom: 14px; color: var(--gold); }
  input, textarea, select { width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border);
                    border-radius: 6px; padding: 8px 10px; margin: 6px 0 12px; font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .row.wrap { flex-wrap: wrap; }
  #login { position: fixed; inset: 0; background: var(--bg); z-index: 99;
           display: flex; align-items: center; justify-content: center; }
  #login .box { width: 340px; }
  label { font-size: 12px; color: var(--muted); }
  /* Tab */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  /* 左侧垂直导航 */
  .layout { display: flex; min-height: calc(100vh - 57px); }
  .sidebar { width: 170px; flex-shrink: 0; background: var(--panel);
             border-right: 1px solid var(--border); padding: 12px 8px; }
  .sidebar .tabs { flex-direction: column; border-bottom: none; margin-bottom: 0; gap: 2px; }
  .sidebar .tab { border-radius: 6px; border: 1px solid transparent; text-align: left; }
  .sidebar .tab.active { background: var(--hover); color: var(--gold); border-color: var(--border); }
  main { flex: 1; min-width: 0; }
  .tab { padding: 7px 16px; cursor: pointer; border-radius: 6px 6px 0 0;
         color: var(--muted); font-size: 13px; user-select: none; }
  .tab.active { background: var(--hover); color: var(--gold); border: 1px solid var(--border); border-bottom: none; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  /* 统计 */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-box .num { font-size: 20px; color: var(--gold); font-weight: bold; }
  .stat-box .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dist-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .bar-row .k { width: 64px; color: var(--muted); text-align: right; }
  .bar { background: var(--bar); height: 12px; border-radius: 4px; overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; background: var(--gold); min-width: 2px; }
  .bar-row .v { width: 36px; color: var(--muted); }
  /* JSON / 日志 */
  pre.json { background: var(--input); padding: 12px; border-radius: 6px; overflow: auto;
             max-height: 460px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .log-list { max-height: 220px; overflow: auto; font-size: 12px; color: var(--muted); }
  .log-list div { padding: 4px 0; border-bottom: 1px solid var(--hover); }
  .log-list b { color: var(--text); }
  .mini-input { width: 58px; padding: 4px 6px; margin: 2px; display: inline-block; }
  .hint { font-size: 11px; color: var(--muted); margin: -6px 0 10px; }
  /* 接口控制台 */
  .sub-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .console { display: grid; grid-template-columns: 300px 1fr; gap: 12px; }
  .console .req-col { display: flex; flex-direction: column; gap: 4px; }
  .api-list { max-height: 440px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
  .api-item { padding: 6px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid var(--hover); }
  .api-item:hover, .api-item.active { background: var(--hover); }
  .api-item .p { color: var(--gold); font-family: Consolas, monospace; }
  .api-item .s { color: var(--muted); }
  .m-chip { display: inline-block; min-width: 42px; text-align: center; padding: 1px 6px;
            border-radius: 4px; font-size: 11px; margin-right: 6px; font-weight: bold; }
  .m-GET { background: #1f3a2a; color: #7ec699; }
  .m-POST { background: #3a2f1f; color: var(--gold); }
  .m-DELETE { background: #3a1f1f; color: #e08b8b; }
  .resp-box { background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 10px;
              font-size: 12px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all;
              font-family: Consolas, monospace; }
  /* 全局功能 Tab：隐藏用户列表、详情卡全宽 */
  main.global #user-list-card { display: none; }
  main.global #detail-card { grid-column: 1 / -1; }
  /* 资源网格卡片 */
  .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin: 10px 0; }
  .res-item { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; }
  .res-item .num { font-size: 16px; color: var(--gold); font-weight: bold; }
  .res-item .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  /* 官服工具库（游戏工具库风格卡片） */
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .tool-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tool-card .tool-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
                          cursor: pointer; background: var(--panel2); user-select: none; }
  .tool-card .tool-head:hover { background: var(--hover); }
  .tool-card .tool-head .icon { font-size: 22px; }
  .tool-card .tool-head .t { font-weight: bold; color: var(--gold); font-size: 14px; }
  .tool-card .tool-head .d { font-size: 11px; color: var(--muted); margin-left: auto; }
  .tool-card .tool-body { padding: 12px 14px; display: none; }
  .tool-card.open .tool-body { display: block; }
  .tool-card .tool-body label { display: block; margin-top: 6px; }
  .tool-card .tool-body input, .tool-card .tool-body textarea { width: 100%; margin: 4px 0 8px; }
  .tool-card .tool-body .resp-box { margin-top: 8px; max-height: 240px; }
  /* 移动端适配：单列布局、控制台/弹窗不溢出、导航横排可滚动 */
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 8px; }
    .sidebar .tabs { flex-direction: row; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
    .sidebar .tabs::-webkit-scrollbar { display: none; }
    main { grid-template-columns: 1fr; padding: 12px; }
    .console { grid-template-columns: 1fr; }
    .api-list { max-height: 240px; }
    header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    header h1 { font-size: 15px; }
    .modal { width: 94vw; }
    .dist-col { grid-template-columns: 1fr; }
    table { font-size: 12px; }
    th, td { padding: 6px 6px; }
  }
  /* Toast 通知 */
  #toast-box { position: fixed; right: 16px; bottom: 16px; z-index: 200;
               display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
  .toast { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--gold);
           color: var(--text); padding: 10px 14px; border-radius: 6px; font-size: 13px;
           box-shadow: 0 4px 16px rgba(0,0,0,.4); word-break: break-all; line-height: 1.5;
           animation: toast-in .25s ease; }
  .toast.ok { border-left-color: #7ec699; }
  .toast.err { border-left-color: #e08b8b; }
  .toast.hide { opacity: 0; transform: translateX(12px); transition: all .3s; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* 骨架屏 */
  .skeleton { color: var(--muted); padding: 20px; text-align: center; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  /* 打印：只保留详情内容 */
  @media print {
    header, .main-nav, #user-list-card, .log-list, #toast-box, .modal-mask, .res-grid,
    .btn-sm, #btn-create, #logout-btn, #theme-btn, #user-pager, #stats-body,
    #checkin-box, .row, button { display: none !important; }
    body { background: #fff !important; color: #000 !important; }
    main { display: block !important; padding: 0 !important; }
    .card { border: none !important; background: #fff !important; padding: 4px 0 !important; }
    .full { grid-column: auto !important; }
    #detail-card { width: 100% !important; }
    pre.json, .resp-box { max-height: none !important; white-space: pre-wrap !important; }
  }
</style>
</head>
<body>
<!-- 登录层 -->
<div id="login">
  <div class="card box">
    <h1 style="color:var(--gold);margin-bottom:16px;">DoctorateTs 管理后台</h1>
    <label>管理令牌（data/config.json 中 admin.token）</label>
    <input id="login-token" type="password" placeholder="请输入管理令牌">
    <button class="primary" id="login-btn" style="width:100%;">进入后台</button>
    <p id="login-err" style="color:var(--danger);margin-top:8px;display:none;">令牌无效或管理接口未启用</p>
  </div>
</div>

<header>
  <h1>DOCTORATETS 管理后台</h1>
  <span class="status-pill" id="pill-offline">离线模式</span>
  <span class="status-pill">端口 <span id="pill-port">-</span></span>
  <span class="status-pill">用户 <span id="pill-users">-</span></span>
  <span style="margin-left:auto;font-size:12px;color:var(--muted);" id="pill-uptime"></span>
  <button id="theme-btn" class="btn-sm">浅色</button>
  <button id="logout-btn">退出</button>
</header>

<div class="layout">
  <!-- 左侧垂直导航（全局 Tab） -->
  <aside class="sidebar main-nav">
    <div class="tabs">
      <div class="tab active" data-tab="overview">概览</div>
      <div class="tab" data-tab="chars">干员</div>
      <div class="tab" data-tab="mails">邮件</div>
      <div class="tab" data-tab="pools">卡池</div>
      <div class="tab" data-tab="api">接口</div>
      <div class="tab" data-tab="official">官服</div>
      <div class="tab" data-tab="pixel">像素画</div>
      <div class="tab" data-tab="raw">数据</div>
    </div>
  </aside>
  <main id="main">

  <!-- 统计（默认折叠为摘要行） -->
  <section class="card full">
    <div class="row" style="align-items:center;margin-bottom:4px;">
      <h3 style="color:var(--gold);">统计</h3>
      <button id="stats-toggle" class="btn-sm" style="margin-left:auto;">展开</button>
    </div>
    <div id="stats-summary" style="font-size:12px;color:var(--muted);"></div>
    <div id="stats-body" style="display:none;">
      <div class="stat-grid" id="stats-grid"></div>
      <div class="dist-col" style="margin-top:14px;">
        <div>
          <label>等级分布</label>
          <div id="stats-level-dist"></div>
        </div>
        <div>
          <label>注册时间分布（按月）</label>
          <div id="stats-register-dist"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 左侧：用户列表 -->
  <section class="card" id="user-list-card">
    <div class="row" style="align-items:center;margin-bottom:10px;">
      <h3 style="color:var(--gold);">用户列表</h3>
      <button class="primary" id="btn-create" style="margin-left:auto;">+ 创建用户</button>
    </div>
    <input id="user-filter" placeholder="搜索 uid/昵称/手机号..." style="margin:0 0 10px;">
    <table>
      <thead><tr><th>UID</th><th>昵称</th><th>等级</th><th>手机</th><th>最后在线</th><th></th></tr></thead>
      <tbody id="user-tbody"></tbody>
    </table>
    <div id="user-pager"></div>
    <p id="user-empty" style="color:var(--muted);text-align:center;padding:20px;">暂无用户</p>
  </section>

  <!-- 右侧：详情/操作 -->
  <section class="card" id="detail-card">
    <h3 style="color:var(--gold);" id="detail-title">用户详情</h3>
    <div id="detail-empty" style="color:var(--muted);padding:20px 0;text-align:center;">点击左侧用户查看用户详情</div>
    <div id="detail-body">
      <div class="tab-pane active" id="pane-overview"></div>
      <div class="tab-pane" id="pane-chars"></div>
      <div class="tab-pane" id="pane-mails"></div>
      <div class="tab-pane" id="pane-pools"></div>
      <div class="tab-pane" id="pane-api"></div>
      <div class="tab-pane" id="pane-official"></div>
      <div class="tab-pane" id="pane-pixel"></div>
      <div class="tab-pane" id="pane-raw"></div>
    </div>
  </section>

  <!-- 操作日志 -->
  <section class="card full">
    <div class="row" style="align-items:center;margin-bottom:10px;">
      <h3 style="color:var(--gold);">操作日志</h3>
      <button id="btn-refresh-logs" class="btn-sm" style="margin-left:auto;">刷新</button>
    </div>
    <div class="log-list" id="logs-list"><span style="color:var(--muted);">暂无操作日志</span></div>
  </section>
</main>
</div>

<!-- 弹窗：发放物品 -->
<div class="modal-mask" id="modal-grant">
  <div class="modal">
    <h3>发放物品 — <span id="grant-uid"></span></h3>
    <label>物品 ID 或中文名（如 4001=龙门币、4003=合成玉、"合成玉"）</label>
    <input id="grant-item" placeholder="4001 或 合成玉">
    <label>搜索物品（按名称/ID，点击结果填入）</label>
    <input id="grant-search" placeholder="输入关键字搜索...">
    <div id="grant-search-results" style="max-height:130px;overflow:auto;font-size:12px;margin-bottom:6px;"></div>
    <label>数量</label>
    <input id="grant-count" type="number" value="1" min="1">
    <div class="row">
      <button id="grant-cancel">取消</button>
      <button class="primary" id="grant-ok">发放</button>
      <button id="grant-all-btn">全部物品</button>
    </div>
  </div>
</div>

<!-- 弹窗：发送邮件 -->
<div class="modal-mask" id="modal-mail">
  <div class="modal">
    <h3>发送邮件 — <span id="mail-uid"></span></h3>
    <label><input type="checkbox" id="mail-all" style="width:auto;margin:0 4px 0 0;vertical-align:middle;">发送给所有用户</label>
    <label>模板（可选，选中自动填充）</label>
    <select id="mail-template"><option value="">自定义</option></select>
    <label>标题</label>
    <input id="mail-subject" placeholder="邮件标题">
    <label>内容</label>
    <textarea id="mail-content" rows="3" placeholder="邮件正文"></textarea>
    <label>附件（id:count，逗号分隔，如 4001:100,4003:10）</label>
    <input id="mail-items" placeholder="4001:100,4003:10">
    <div class="row">
      <button id="mail-cancel">取消</button>
      <button class="primary" id="mail-ok">发送</button>
    </div>
  </div>
</div>

<!-- 弹窗：创建用户 -->
<div class="modal-mask" id="modal-create">
  <div class="modal">
    <h3>创建用户</h3>
    <label>手机号</label>
    <input id="create-phone" placeholder="13800000000">
    <label>密码（留空默认同手机号）</label>
    <input id="create-password" placeholder="123456">
    <div class="row">
      <button id="create-cancel">取消</button>
      <button class="primary" id="create-ok">创建</button>
    </div>
  </div>
</div>

<!-- 弹窗：发放干员 -->
<div class="modal-mask" id="modal-char">
  <div class="modal">
    <h3>发放干员 — <span id="char-uid"></span></h3>
    <label>干员 ID 或中文名（如 char_002_amiya 或 阿米娅）</label>
    <input id="char-id" placeholder="char_002_amiya">
    <p class="hint">重复干员将按稀有度折算为信物与高级/资质凭证</p>
    <div class="row">
      <button id="char-cancel">取消</button>
      <button class="primary" id="char-ok">发放</button>
    </div>
  </div>
</div>

<!-- 弹窗：干员详情 -->
<div class="modal-mask" id="modal-charinfo">
  <div class="modal" style="width:520px;">
    <h3 id="charinfo-title">干员详情</h3>
    <div id="charinfo-body" style="font-size:12px;color:var(--muted);">加载中...</div>
    <div class="row">
      <button id="charinfo-copy" class="btn-sm">复制</button>
      <button id="charinfo-close" style="margin-left:auto;">关闭</button>
    </div>
  </div>
</div>

<!-- 弹窗：自定义确认 -->
<div class="modal-mask" id="modal-confirm">
  <div class="modal" style="width:380px;">
    <h3 id="confirm-title">确认操作</h3>
    <div id="confirm-msg" style="color:var(--muted);font-size:13px;margin-bottom:14px;"></div>
    <div class="row">
      <button id="confirm-cancel">取消</button>
      <button class="primary" id="confirm-ok">确认</button>
    </div>
  </div>
</div>

<!-- 弹窗：解锁皮肤 -->
<div class="modal-mask" id="modal-skin">
  <div class="modal">
    <h3>解锁皮肤 — <span id="skin-uid"></span></h3>
    <label>皮肤 ID（如 char_002_amiya#2）</label>
    <input id="skin-id" placeholder="char_002_amiya#2">
    <div class="row">
      <button id="skin-cancel">取消</button>
      <button class="primary" id="skin-ok">解锁</button>
    </div>
  </div>
</div>

<script>
/* DoctorateTs 管理后台交互逻辑（原生 JS，零依赖） */
(function () {
  "use strict";

  /* ---------- Toast 通知 ---------- */
  function toast(msg, type) {
    if (!type) {
      type = /失败|错误|无效/.test(msg) ? "err" : /成功|已 |完成|更新|设置/.test(msg) ? "ok" : "info";
    }
    var box = $("toast-box");
    if (!box) {
      box = document.createElement("div");
      box.id = "toast-box";
      document.body.appendChild(box);
    }
    var el = document.createElement("div");
    el.className = "toast " + type;
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () {
      el.classList.add("hide");
      setTimeout(function () { el.remove(); }, 320);
    }, 3000);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { toast("已复制到剪贴板", "ok"); });
    }
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("已复制到剪贴板", "ok"); } catch (e) { toast("复制失败", "err"); }
    ta.remove();
    return Promise.resolve();
  }

  var API = "/admin/api";
  var token = localStorage.getItem("adminToken") || "";
  var selectedUid = null;
  var selectedPoolId = null;
  var userFilter = "";
  var currentTab = "overview";

  function api(path, options) {
    options = options || {};
    var headers = { "X-Admin-Token": token };
    if (options.headers) Object.assign(headers, options.headers);
    if (options.body) headers["Content-Type"] = "application/json";
    return fetch(API + path, Object.assign({}, options, { headers: headers }))
      .then(function (res) {
        if (res.status === 401 || res.status === 403) {
          throw new Error("认证失败");
        }
        return res.json().then(function (data) {
          if (!res.ok) throw new Error(data.error || "请求失败(" + res.status + ")");
          return data;
        });
      });
  }

  function fmtTs(ts) { return ts ? new Date(ts * 1000).toLocaleString() : "-"; }
  function $(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- 状态 / 用户列表 ---------- */

  function refreshStatus() {
    return api("/status").then(function (st) {
      $("pill-offline").textContent = st.offline ? "离线模式" : "在线模式";
      $("pill-offline").className = "status-pill" + (st.offline ? "" : " online");
      $("pill-port").textContent = st.port;
      $("pill-users").textContent = st.userCount;
      $("pill-uptime").textContent = "运行 " + Math.floor(st.uptime / 60) + " 分钟";
      // 统计折叠摘要行
      $("stats-summary").textContent = "用户 " + st.userCount +
        " | 数据 " + (st.totalDataKB / 1024).toFixed(1) + "MB" +
        " | 内存 " + (st.memoryMB || "-") + "MB";
    }).catch(function () {});
  }

  var USER_PAGE_SIZE = 50;
  var userPage = 1;

  function refreshUsers() {
    return api("/users?filter=" + encodeURIComponent(userFilter)).then(function (users) {
      var pages = Math.max(1, Math.ceil(users.length / USER_PAGE_SIZE));
      if (userPage > pages) userPage = pages;
      var pageUsers = users.slice((userPage - 1) * USER_PAGE_SIZE, userPage * USER_PAGE_SIZE);
      var tbody = $("user-tbody");
      tbody.innerHTML = "";
      $("user-empty").style.display = users.length ? "none" : "block";
      pageUsers.forEach(function (u) {
        var tr = document.createElement("tr");
        tr.className = "clickable";
        if (u.uid === selectedUid) tr.classList.add("active");
        tr.innerHTML =
          "<td>" + u.uid + "</td><td>" + escapeHtml(u.nickName) + "</td><td>" + u.level + "</td>" +
          "<td>" + escapeHtml(u.phone || "-") + "</td><td>" + fmtTs(u.lastOnlineTs) + "</td>" +
          "<td><button data-grant=\"" + u.uid + "\" class=\"btn-sm\">发物品</button> " +
          "<button data-mail=\"" + u.uid + "\" class=\"btn-sm\">发邮件</button></td>";
        tr.querySelector("[data-grant]").addEventListener("click", function (e) {
          e.stopPropagation();
          openGrant(u.uid);
        });
        tr.querySelector("[data-mail]").addEventListener("click", function (e) {
          e.stopPropagation();
          openMail(u.uid);
        });
        tr.addEventListener("click", function () { selectUser(u.uid); });
        tbody.appendChild(tr);
      });
      // 分页控件
      var pagerBox = $("user-pager");
      if (pagerBox) {
        pagerBox.innerHTML = pages > 1 ? pagerHtml(userPage, pages) : "";
        document.querySelectorAll("#user-pager [data-page]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var p = Number(btn.getAttribute("data-page"));
            if (p >= 1 && p <= pages) {
              userPage = p;
              refreshUsers();
            }
          });
        });
      }
    }).catch(function () {});
  }

  /* ---------- 统计 / 日志 ---------- */

  function refreshStats() {
    return api("/stats").then(function (s) {
      $("stats-grid").innerHTML =
        statBox(s.userCount, "用户数") + statBox(s.totalChars, "干员总数") +
        statBox(fmtNum(s.totalGold), "龙门币合计") + statBox(fmtNum(s.totalDiamond), "合成玉合计") +
        statBox(s.avgLevel, "平均等级");
      $("stats-level-dist").innerHTML = distBars(s.levelDist);
      $("stats-register-dist").innerHTML = distBars(s.registerDist);
    }).catch(function () {});
  }

  function statBox(num, lbl) {
    return '<div class="stat-box"><div class="num">' + escapeHtml(num) + '</div>' +
           '<div class="lbl">' + escapeHtml(lbl) + "</div></div>";
  }

  function fmtNum(n) {
    return n >= 100000000 ? (n / 100000000).toFixed(1) + "亿" :
           n >= 10000 ? (n / 10000).toFixed(1) + "万" : String(n);
  }

  /** 资源网格卡片 */
  function resItem(num, lbl) {
    return '<div class="res-item"><div class="num">' + escapeHtml(String(num)) +
      '</div><div class="lbl">' + escapeHtml(lbl) + "</div></div>";
  }

  /** 分页控件 HTML */
  function pagerHtml(page, pages) {
    return '<div class="row" style="align-items:center;gap:8px;margin:8px 0;">' +
      '<button class="btn-sm" data-page="' + (page - 1) + '"' + (page <= 1 ? " disabled" : "") + '>上一页</button>' +
      '<span style="font-size:12px;color:var(--muted);">第 ' + page + "/" + pages + " 页</span>" +
      '<button class="btn-sm" data-page="' + (page + 1) + '"' + (page >= pages ? " disabled" : "") + '>下一页</button></div>';
  }

  /** 干员星级分布条（客户端按 chars 统计） */
  function starDistBar(chars) {
    if (!chars || !chars.length) return "";
    var dist = [0, 0, 0, 0, 0, 0];
    chars.forEach(function (c) { dist[c.rarity]++; });
    var segs = dist.map(function (n, r) {
      return n ? '<div style="width:' + (n / chars.length * 100) + '%;background:' + starColor(r) + ';" title="' + (r + 1) + "★ x" + n + '"></div>' : "";
    }).join("");
    var legend = dist.map(function (n, r) {
      return n ? '<span style="color:' + starColor(r) + ';">' + (r + 1) + "★" + n + "</span>" : "";
    }).join(" ");
    return '<div class="row" style="align-items:center;gap:8px;margin-bottom:8px;">' +
      '<div style="flex:1;display:flex;height:10px;border-radius:4px;overflow:hidden;background:var(--bar);">' + segs + "</div>" +
      '<span style="font-size:11px;color:var(--muted);white-space:nowrap;">' + legend + "</span></div>";
  }

  function distBars(dist) {
    var keys = Object.keys(dist || {}).sort();
    if (!keys.length) return '<span style="color:var(--muted);">暂无数据</span>';
    var max = Math.max.apply(null, keys.map(function (k) { return dist[k]; }));
    return keys.map(function (k) {
      var w = Math.max(2, Math.round(dist[k] / max * 100));
      return '<div class="bar-row"><span class="k">' + escapeHtml(k) + "</span>" +
             '<span class="bar"><i style="width:' + w + '%"></i></span>' +
             '<span class="v">' + dist[k] + "</span></div>";
    }).join("");
  }

  function refreshLogs() {
    return api("/logs?limit=50").then(function (entries) {
      var box = $("logs-list");
      if (!entries.length) {
        box.innerHTML = '<span style="color:var(--muted);">暂无操作日志</span>';
        return;
      }
      box.innerHTML = entries.map(function (e) {
        return "<div><b>[" + fmtTs(e.ts) + "]</b> " + escapeHtml(e.action) +
               " uid=" + escapeHtml(e.uid || "-") + " — " + escapeHtml(e.detail) + "</div>";
      }).join("");
    }).catch(function () {});
  }

  /* ---------- 用户详情（Tab） ---------- */

  var TAB_LABELS = { overview: "概览", chars: "干员", mails: "邮件", pools: "卡池", api: "接口", official: "官服", pixel: "像素画", raw: "数据" };
  /** 全局功能 Tab（不依赖选中用户，内容全宽） */
  var GLOBAL_TABS = ["pools", "api", "official", "pixel"];

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".main-nav .tab").forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-tab") === tab);
    });
    document.querySelectorAll("#detail-body .tab-pane").forEach(function (p) {
      p.classList.toggle("active", p.id === "pane-" + tab);
    });
    var isGlobal = GLOBAL_TABS.indexOf(tab) !== -1;
    $("main").classList.toggle("global", isGlobal);
    $("detail-title").textContent = isGlobal
      ? TAB_LABELS[tab]
      : selectedUid ? "用户详情 — " + selectedUid : "用户详情";
    loadPane(tab, selectedUid);
  }

  /** 用户相关 Tab（需选中用户） */
  var USER_TABS = ["overview", "chars", "mails", "raw"];

  function loadPane(tab, uid) {
    // 全局功能 Tab（接口/卡池/官服/像素画）不依赖选中用户，未选用户也可用
    if (tab === "pools") { loadPoolsPane(); return; }
    if (tab === "api") { loadApiPane(); return; }
    if (tab === "official") { loadOfficialPane(); return; }
    if (tab === "pixel") { loadPixelPane(); return; }
    // 用户相关 Tab：未选用户时提示
    if (!uid) {
      var pane = $("pane-" + tab);
      if (pane) pane.innerHTML = '<p style="color:var(--muted);padding:16px 0;text-align:center;">← 先在左侧用户列表选择用户</p>';
      return;
    }
    if (tab === "overview") loadOverview(uid);
    else if (tab === "chars") loadChars(uid);
    else if (tab === "mails") loadMails(uid);
    else if (tab === "raw") loadRaw(uid);
  }

  function selectUser(uid) {
    selectedUid = uid;
    $("detail-title").textContent = "用户详情 — " + uid;
    $("detail-empty").style.display = "none";
    refreshUsers();
    loadPane(currentTab, uid);
  }

  function loadOverview(uid) {
    setSkeleton("pane-overview");
    api("/users/" + encodeURIComponent(uid)).then(function (info) {
      var inv = (info.inventoryInfo || []).slice(0, 20)
        .map(function (it) { return escapeHtml(it.name) + "(" + escapeHtml(it.id) + ") x" + it.count; })
        .join("<br>") || "（空）";
      $("pane-overview").innerHTML =
        "<p><b>" + escapeHtml(info.nickName) + "#" + escapeHtml(info.nickNumber) + "</b> Lv." + info.level + "</p>" +
        "<p style=\"color:var(--muted);margin-top:6px;\">UID " + info.uid + " | 注册 " + fmtTs(info.registerTs) +
        " | 最后在线 " + fmtTs(info.lastOnlineTs) + "</p>" +
        '<div class="row wrap" style="gap:8px;margin:12px 0;">' +
        '<button id="act-maxout" class="primary">一键满配</button>' +
        '<button id="act-building">基建满级</button>' +
        '<button id="act-refresh">每日刷新</button>' +
        '<button id="act-save">保存</button>' +
        '<button id="act-backup">备份</button>' +
        '<button id="act-restore">恢复最近备份</button>' +
        '<button id="btn-char">发干员</button>' +
        '<button id="btn-skin">发皮肤</button></div>' +
        '<div id="checkin-box" style="margin-bottom:10px;"></div>' +
        '<div class="res-grid">' +
        resItem(fmtNum(info.gold), "龙门币") + resItem(fmtNum(info.androidDiamond), "合成玉") +
        resItem((info.ap || 0) + "/" + (info.maxAp || "-"), "理智") + resItem(info.gachaTicket, "寻访凭证") +
        resItem(info.recruitLicense, "招募许可") + resItem(info.practiceTicket, "演习券") +
        resItem(info.hggShard || 0, "高级凭证") + resItem(info.lggShard || 0, "资质凭证") +
        resItem(info.socialPoint || 0, "社交点") + resItem(info.diamondShard || 0, "源石碎片") +
        resItem(info.instantFinishTicket || 0, "加急许可") + resItem(info.tenGachaTicket || 0, "十连券") +
        resItem(info.charCnt, "干员数") + resItem(info.exp, "经验") +
        "</div>" +
        "<h4 style=\"color:var(--gold);margin:12px 0 6px;\">背包道具（前 20）</h4>" +
        "<div style=\"font-size:12px;color:var(--muted);max-height:220px;overflow:auto;\">" + inv + "</div>";
      bindOverviewActions(uid);
      loadCheckIn(uid);

  /* 签到区：状态 + 重置/代签 */
  function loadCheckIn(uid) {
    var box = $("checkin-box");
    if (!box) return;
    box.innerHTML = '<span style="color:var(--muted);font-size:12px;">签到加载中...</span>';
    api("/users/" + encodeURIComponent(uid) + "/checkin").then(function (st) {
      box.innerHTML =
        '<div class="row" style="align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;">' +
        '<span style="font-size:12px;">签到 <b style="color:var(--gold);">' +
        (st.rewardIndex >= 0 ? st.rewardIndex + 1 : 0) + "/" + st.total + "</b> 档" +
        (st.canCheckIn ? "（今日可签）" : "") + " <span style=\"color:var(--muted);\">" + escapeHtml(st.groupTitle || "") + "</span></span>" +
        '<button id="checkin-do" class="btn-sm primary">代签</button>' +
        '<button id="checkin-reset" class="btn-sm">重置</button></div>';
      $("checkin-do").addEventListener("click", function () {
        api("/users/" + encodeURIComponent(uid) + "/checkin/do", { method: "POST", body: "{}" })
          .then(function (r) {
            toast(r.rewards.length
              ? "代签成功：" + r.rewards.map(function (x) { return x.name + " x" + x.count; }).join(", ")
              : "当日已签（无奖励）");
            loadCheckIn(uid);
            refreshLogs();
          })
          .catch(function (e) { toast("代签失败：" + e.message); });
      });
      $("checkin-reset").addEventListener("click", function () {
        confirmDialog("重置该用户签到进度（重新领一轮）？", function () {
          api("/users/" + encodeURIComponent(uid) + "/checkin/reset", { method: "POST", body: "{}" })
            .then(function () {
              toast("已重置签到");
              loadCheckIn(uid);
              refreshLogs();
            })
            .catch(function (e) { toast("重置失败：" + e.message); });
        });
      });
    }).catch(function () {
      box.innerHTML = "";
    });
  }

  function bindOverviewActions(uid) {
    var act = {
      "act-maxout": { path: "/maxout", label: "一键满配" },
      "act-building": { path: "/building-max", label: "基建满级" },
      "act-refresh": { path: "/refresh", label: "每日刷新" },
      "act-save": { path: "/save", label: "保存" },
      "act-backup": { path: "/backup", label: "备份" },
    };    Object.keys(act).forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.addEventListener("click", function () {
        var conf = act[id];
        el.disabled = true;
        api("/users/" + encodeURIComponent(uid) + conf.path, { method: "POST", body: "{}" })
          .then(function (r) {
            var msg = id === "act-backup" ? "已备份：" + r.name : "操作成功" + (r.rooms != null ? "（" + r.rooms + " 间房间）" : "");
            if (id === "act-maxout" && r.chars != null) msg = "满配完成：干员 " + r.chars + " | 物品 " + r.items + " | 皮肤 " + r.skins + " | 基建 " + r.rooms;
            toast(conf.label + "成功 — " + msg);
            loadOverview(uid);
            refreshLogs();
          })
          .catch(function (e) { toast(conf.label + "失败：" + e.message); })
          .finally(function () { el.disabled = false; });
      });
    });
    var restoreBtn = $("act-restore");
    if (restoreBtn) {
      restoreBtn.addEventListener("click", function () {
        api("/users/" + encodeURIComponent(uid) + "/backups").then(function (list) {
          if (!list.length) { toast("暂无备份"); return; }
          var b = list[0];
          confirmDialog("将从 " + b.name + "（" + fmtTs(b.ts) + "）恢复，覆盖当前存档，确认？", function () {
            api("/users/" + encodeURIComponent(uid) + "/restore", {
              method: "POST", body: JSON.stringify({ backup: b.name }),
            }).then(function () {
              toast("已恢复：" + b.name);
              loadOverview(uid);
              refreshLogs();
            }).catch(function (e) { toast("恢复失败：" + e.message); });
          });
        });
      });
    }
    $("btn-char").addEventListener("click", function () { openChar(uid); });
    $("btn-skin").addEventListener("click", function () { openSkin(uid); });
  }

  function loadChars(uid) {
    setSkeleton("pane-chars");
    api("/users/" + encodeURIComponent(uid) + "/chars").then(function (chars) {
      if (!chars.length) {
        $("pane-chars").innerHTML = '<p style="color:var(--muted);">暂无干员</p>';
        return;
      }
      var CHAR_PAGE_SIZE = 50;
      var render = function (filter, page) {
        page = page || 1;
        var kw = filter.toLowerCase();
        var list = chars.filter(function (c) {
          return !kw || (c.name + c.charId + " " + c.instId).toLowerCase().indexOf(kw) !== -1;
        });
        var pages = Math.max(1, Math.ceil(list.length / CHAR_PAGE_SIZE));
        if (page > pages) page = pages;
        var pageList = list.slice((page - 1) * CHAR_PAGE_SIZE, page * CHAR_PAGE_SIZE);
        var rows = pageList.map(function (c) {
          return "<tr>" +
            "<td>" + c.instId + "</td>" +
            '<td><a class="cinfo-link" data-i="' + c.instId + '" style="color:var(--gold);cursor:pointer;text-decoration:underline;">' + escapeHtml(c.name) + "</a></td>" +
            "<td><span style=\"color:" + starColor(c.rarity) + "\">" + (c.rarity + 1) + "★</span></td>" +
            "<td><input class=\"mini-input\" data-f=\"level\" data-i=\"" + c.instId + "\" type=\"number\" value=\"" + c.level + "\" min=\"1\" max=\"" + c.maxLevel + "\"></td>" +
            "<td><input class=\"mini-input\" data-f=\"evolvePhase\" data-i=\"" + c.instId + "\" type=\"number\" value=\"" + c.evolvePhase + "\" min=\"0\" max=\"2\"></td>" +
            "<td><input class=\"mini-input\" data-f=\"potentialRank\" data-i=\"" + c.instId + "\" type=\"number\" value=\"" + c.potentialRank + "\" min=\"0\" max=\"5\"></td>" +
            "<td><input class=\"mini-input\" data-f=\"mainSkillLvl\" data-i=\"" + c.instId + "\" type=\"number\" value=\"" + c.mainSkillLvl + "\" min=\"1\" max=\"7\"></td>" +
            "<td><button class=\"btn-sm char-apply\" data-i=\"" + c.instId + "\">应用</button></td></tr>";
        }).join("");
        var pager = list.length > CHAR_PAGE_SIZE ? pagerHtml(page, pages) : "";
        $("pane-chars").innerHTML =
          starDistBar(list) +
          '<input id="char-filter" placeholder="搜索干员（名称/ID/instId）..." style="margin:0 0 8px;">' +
          '<div class="row" style="align-items:center;margin-bottom:8px;">' +
          '<button id="maxchars-btn">全部满级</button>' +
          '<button id="repairchars-btn">修复结构</button>' +
          '<span style="color:var(--muted);font-size:12px;">共 ' + chars.length + " 名（显示 " + list.length + "）</span></div>" +
          pager +
          "<table><thead><tr><th>instId</th><th>干员</th><th>星级</th><th>等级</th><th>精二</th><th>潜能</th><th>技能</th><th></th></tr></thead><tbody>" +
          (rows || '<tr><td colspan="8" style="color:var(--muted);">无匹配干员</td></tr>') +
          "</tbody></table>" +
          pager;
        document.querySelectorAll("#pane-chars [data-page]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var p = Number(btn.getAttribute("data-page"));
            if (p >= 1 && p <= pages) render($("char-filter").value.trim(), p);
          });
        });
        $("char-filter").addEventListener("input", function () {
          render(this.value.trim(), 1); // 过滤重置到第一页
        });
        var mc = $("maxchars-btn");
        if (mc) {
          mc.addEventListener("click", function () {
            confirmDialog("批量拉满全部 " + chars.length + " 名干员？", function () {
              api("/users/" + encodeURIComponent(uid) + "/maxchars", { method: "POST", body: "{}" })
                .then(function (r) {
                  toast("已拉满 " + r.chars + " 名干员");
                  loadChars(uid);
                  refreshLogs();
                })
                .catch(function (e) { toast("操作失败：" + e.message); });
            });
          });
        }
        var rc = $("repairchars-btn");
        if (rc) {
          rc.addEventListener("click", function () {
            api("/users/" + encodeURIComponent(uid) + "/repair-chars", { method: "POST", body: "{}" })
              .then(function (r) {
                toast("已修复 " + r.chars + " 名干员 / " + r.fields + " 个字段");
                loadChars(uid);
                refreshLogs();
              })
              .catch(function (e) { toast("操作失败：" + e.message); });
          });
        }
        document.querySelectorAll(".char-apply").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var instId = Number(btn.getAttribute("data-i"));
            var attrs = {};
            document.querySelectorAll("#pane-chars [data-i=\"" + instId + "\"]").forEach(function (inp) {
              attrs[inp.getAttribute("data-f")] = Number(inp.value);
            });
            api("/users/" + encodeURIComponent(uid) + "/chars", {
              method: "POST", body: JSON.stringify(Object.assign({ instId: instId }, attrs)),
            }).then(function (r) {
              toast("已应用：" + r.name + "（精二 " + r.evolvePhase + " | 等级 " + r.level + " | 潜能 " + r.potentialRank + " | 技能 " + r.mainSkillLvl + "）");
              loadChars(uid);
              refreshLogs();
            }).catch(function (e) { toast("修改失败：" + e.message); });
          });
        });
        // 干员名点击 → 详情弹窗

  function renderApiList(endpoints, filter) {
    var box = $("api-list");
    var kw = filter.toLowerCase();
    var items = endpoints.filter(function (e) {
      return (e.method + " " + e.path + " " + (e.summary || "")).toLowerCase().indexOf(kw) !== -1;
    });
    box.innerHTML = items.map(function (e) {
      return '<div class="api-item" data-p="' + e.path + '">' + chip(e.method) +
        '<span class="p">' + escapeHtml(e.path) + "</span><br>" +
        '<span class="s">' + escapeHtml(e.summary || "") + "</span></div>";
    }).join("") || '<div style="padding:10px;color:var(--muted);">无匹配端点</div>';
    document.querySelectorAll("#api-list .api-item").forEach(function (el) {
      el.addEventListener("click", function () {
        var path = el.getAttribute("data-p");
        var spec = endpoints.find(function (e) { return e.path === path; });
        loadIntoBuilder(spec);
        document.querySelectorAll("#api-list .api-item").forEach(function (x) {
          x.classList.remove("active");
        });
        el.classList.add("active");
      });
    });
  }

  function loadIntoBuilder(spec) {
    $("req-method").value = spec.method;
    var path = spec.path;
    // :uid 用当前选中用户预填，其余路径参数留给用户编辑
    if (selectedUid && path.indexOf(":uid") !== -1) {
      path = path.split(":uid").join(selectedUid);
    }
    $("req-path").value = path;
    $("req-body").value = spec.body || "";
    var hint = "";
    if (spec.params && spec.params.length) {
      // 请求类型提示：参数名 + 类型标签（string/number/boolean/object）+ 必填
      hint = "请求类型：" + spec.params.map(function (p) {
        return '<b style="color:var(--gold);">' + escapeHtml(p.name) + "</b>" +
          '<span style="color:#7ec699;font-size:10px;border:1px solid #2a4a3a;border-radius:3px;padding:0 3px;margin:0 2px;">' +
          escapeHtml(p.type) + "</span>" + (p.required ? "<b style=\"color:var(--danger);\">*</b> " : " ") +
          escapeHtml(p.desc);
      }).join("；");
    }
    // 用 HTML 提示（含类型标签）
    $("req-body").setAttribute("data-hint-html", hint);
    $("req-body").setAttribute("placeholder", hint ? "参数提示见下方" : "{}");
    var hintBox = document.getElementById("req-hint");
    if (hintBox) hintBox.innerHTML = hint;
  }

  function sendAdminReq() {
    var method = $("req-method").value;
    var path = $("req-path").value.trim();
    if (!path) { toast("请填写路径"); return; }
    var bodyRaw = $("req-body").value.trim();
    var options = { method: method };
    if (bodyRaw) {
      try {
        options.body = JSON.stringify(JSON.parse(bodyRaw));
      } catch (e) {
        toast("请求体不是合法 JSON"); return;
      }
    }
    showResp("req-resp", "请求中...");
    // 管理端点路径已含 /api 前缀（挂在 /admin 下）
    fetch("/admin" + path, Object.assign({}, options, {
      headers: { "X-Admin-Token": token, "Content-Type": "application/json" },
    }))
      .then(function (res) {
        return res.text().then(function (txt) {
          var pretty;
          try { pretty = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) { pretty = txt; }
          showResp("req-resp", "HTTP " + res.status + "\n" + pretty);
        });
      })
      .catch(function (e) { showResp("req-resp", "请求失败: " + e.message); });
  }

  /* ---------- 像素画 Tab（24×24 编辑器 + 上传官服） ---------- */

  function loadPixelPane() {
    var pane = $("pane-pixel");
    pane.innerHTML =
      '<p style="color:var(--muted);font-size:12px;">阿卡狄亚像素画：24×24 画布、每像素 3 字节 RGB（共 1728B）。' +
      '鼠标绘制 / 橡皮擦 / 清空；可下载 PNG 与像素数据，或上传到官服（完整 savePixelArt 流程：登录 → 网关申请 token → multipart 上传 → 保存确认）。</p>' +
      '<div class="row" style="align-items:flex-start;gap:18px;flex-wrap:wrap;">' +
      '<div>' +
      '<canvas id="px-canvas" width="480" height="480" style="background:#fff;image-rendering:pixelated;border:1px solid var(--border);cursor:crosshair;touch-action:none;"></canvas>' +
      '<div class="row" style="margin-top:8px;">' +
      '<button id="px-clear" class="primary">清空</button>' +
      '<button id="px-sample">示例</button>' +
      '<button id="px-png">下载 PNG</button>' +
      '<button id="px-data">下载像素数据</button>' +
      "</div></div>" +
      "<div>" +
      '<p style="font-size:12px;color:var(--muted);margin:0 0 6px;">调色板（点击选色）</p>' +
      '<div id="px-palette" style="display:grid;grid-template-columns:repeat(10,26px);gap:4px;"></div>' +
      '<p style="font-size:12px;color:var(--muted);margin:10px 0 6px;">工具</p>' +
      '<div class="row"><button id="px-eraser" class="primary">橡皮擦</button><span id="px-tool" style="font-size:12px;color:var(--gold);margin-left:8px;"></span></div>' +
      '<p style="font-size:12px;color:var(--muted);margin:10px 0 6px;">上传官服（会真实写入该账号的 act1arkhub 活动）</p>' +
      '<div class="row">' +
      '<input id="px-phone" placeholder="官服手机号" style="flex:1;">' +
      '<input id="px-pwd" type="password" placeholder="官服密码" style="flex:1;">' +
      '<button id="px-upload" class="primary">上传</button></div>' +
      '<div class="resp-box" id="px-resp" style="margin-top:10px;">上传结果显示在此</div>' +
      "</div></div>";

    var PALETTE = ["#222222","#b4b4b4","#eae7df","#ffffff","#d32f36","#9c0a00","#d60c4a","#e6968d","#fe9875","#f7d0c0","#fcefea","#fbf6e8","#dcd2c8","#e2ceab","#d56322","#d48c42","#f29900","#f9c933","#fce499","#b3b47a","#c2da72","#6c6e00","#b19155","#a98f74","#aa9228","#3f2b12","#74491f","#534658","#2a2446","#394599","#5a459d","#baa3d7","#b6bcdf","#a9acbe","#63abb9","#b4d2dc","#91d8e6","#47aea0","#b6d3c8","#273864"];
    var SIZE = 24;
    var cell = 20;
    var WHITE = [255, 255, 255];
    var grid = [];
    for (var i = 0; i < SIZE * SIZE; i++) grid.push(WHITE.slice());
    var current = [0, 0, 0];
    var eraser = false;

    var canvas = $("px-canvas");
    var ctx = canvas.getContext("2d");

    function hexToRgb(h) {
      return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    }
    function draw() {
      ctx.fillStyle = "rgb(255,255,255)";
      ctx.fillRect(0, 0, 480, 480);
      for (var y = 0; y < SIZE; y++) {
        for (var x = 0; x < SIZE; x++) {
          var c = grid[y * SIZE + x];
          ctx.fillStyle = "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }
      ctx.strokeStyle = "rgba(0,0,0,0.12)";
      ctx.lineWidth = 1;
      for (var i = 0; i <= SIZE; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, 480); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(480, i * cell); ctx.stroke();
      }
      updateTool();
    }
    function paintAt(e) {
      var rect = canvas.getBoundingClientRect();
      var x = Math.floor(((e.clientX - rect.left) * (480 / rect.width)) / cell);
      var y = Math.floor(((e.clientY - rect.top) * (480 / rect.height)) / cell);
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
      grid[y * SIZE + x] = eraser ? WHITE.slice() : current.slice();
      draw();
    }
    var drawing = false;
    canvas.addEventListener("mousedown", function (e) { drawing = true; paintAt(e); });
    canvas.addEventListener("mousemove", function (e) { if (drawing) paintAt(e); });
    window.addEventListener("mouseup", function () { drawing = false; });
    canvas.addEventListener("touchstart", function (e) { e.preventDefault(); drawing = true; paintAt(e.touches[0]); }, { passive: false });
    canvas.addEventListener("touchmove", function (e) { e.preventDefault(); if (drawing) paintAt(e.touches[0]); }, { passive: false });
    canvas.addEventListener("touchend", function () { drawing = false; });

    var palBox = $("px-palette");
    PALETTE.forEach(function (h) {
      var sw = document.createElement("div");
      sw.style.cssText = "width:26px;height:26px;background:" + h + ";border:1px solid var(--border);border-radius:4px;cursor:pointer;";
      sw.addEventListener("click", function () {
        eraser = false;
        current = hexToRgb(h);
        updateTool();
      });
      palBox.appendChild(sw);
    });
    function updateTool() {
      $("px-tool").textContent = eraser
        ? "橡皮擦"
        : "颜色 #" + current.map(function (n) { return n.toString(16).padStart(2, "0"); }).join("");
    }

    function flatPixels() {
      var flat = [];
      for (var i = 0; i < grid.length; i++) flat.push(grid[i][0], grid[i][1], grid[i][2]);
      return flat;
    }

    $("px-eraser").addEventListener("click", function () { eraser = !eraser; updateTool(); });
    $("px-clear").addEventListener("click", function () {
      for (var i = 0; i < grid.length; i++) grid[i] = WHITE.slice();
      draw();
    });
    $("px-sample").addEventListener("click", function () {
      // 示例：用心形掩码填当前色
      var heart = [
        "....XXXX......XXXX....", "..XXXXXXXX..XXXXXXXX..",
        ".XXXXXXXXXX.XXXXXXXXX.", ".XXXXXXXXXXXXXXXXXXXX.",
        "XXXXXXXXXXXXXXXXXXXXXX", "XXXXXXXXXXXXXXXXXXXXXX",
        ".XXXXXXXXXXXXXXXXXXXX.", "..XXXXXXXXXXXXXXXXXX..",
        "...XXXXXXXXXXXXXXXX....", ".....XXXXXXXXXXXX......",
        ".......XXXXXXXX........", ".........XXXX..........",
        "...........XX..........", ".......................",
        ".......................", ".......................",
        ".......................", ".......................",
        ".......................", ".......................",
        ".......................", ".......................",
        ".......................", ".......................",
      ];
      for (var y = 0; y < SIZE; y++) {
        var row = heart[y] || "";
        for (var x = 0; x < SIZE; x++) {
          if (row[x] === "X") grid[y * SIZE + x] = current.slice();
        }
      }
      draw();
    });
    $("px-png").addEventListener("click", function () {
      var a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "pixel-art.png";
      a.click();
    });
    $("px-data").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(flatPixels())], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "pixel-data.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });
    $("px-upload").addEventListener("click", function () {
      var phone = $("px-phone").value.trim();
      var pwd = $("px-pwd").value.trim();
      if (!phone || !pwd) { toast("请填写官服手机号与密码"); return; }
      $("px-resp").textContent = "上传中...（登录官服 → 网关申请 token → multipart 上传 → 保存确认，请耐心等待）";
      api("/pixel/upload-official", {
        method: "POST",
        body: JSON.stringify({ phone: phone, pwd: pwd, pixelData: flatPixels() }),
      })
        .then(function (r) {
          showResp("px-resp",
            "上传成功\npixelArtId: " + r.pixelArtId + "\n上传 token: " + r.uploadToken +
            "\n官服响应: " + JSON.stringify(r.httpResp, null, 2));
          refreshLogs();
        })
        .catch(function (e) { showResp("px-resp", "上传失败: " + e.message); });
    });

    draw();
  }

    token = $("login-token").value.trim();
    api("/status").then(function () {
      localStorage.setItem("adminToken", token);
      hideLogin();
      refreshAll();
      loadPane(currentTab, selectedUid); // 初始化当前 Tab（未选用户时全局 Tab 可用/用户 Tab 提示）
    }).catch(function () {
      $("login-err").style.display = "block";
    });
  });
  $("login-token").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("login-btn").click();
  });
  $("logout-btn").addEventListener("click", function () {
    token = "";
    localStorage.removeItem("adminToken");
    selectedUid = null;
    selectedPoolId = null;
    userFilter = "";
    currentTab = "overview";
    showLogin();
  });

  /* 用户搜索：输入即过滤，轮询保持 filter */
  $("user-filter").addEventListener("input", function () {
    userFilter = this.value.trim();
    refreshUsers();
  });

  /* ---------- Tab 切换 / 统计折叠 ---------- */

  document.querySelectorAll(".main-nav .tab").forEach(function (t) {
    t.addEventListener("click", function () { switchTab(t.getAttribute("data-tab")); });
  });
  $("btn-refresh-logs").addEventListener("click", refreshLogs);
  $("stats-toggle").addEventListener("click", function () {
    var body = $("stats-body");
    var open = body.style.display !== "none";
    body.style.display = open ? "none" : "block";
    this.textContent = open ? "展开" : "收起";
    if (!open) {
      refreshStats();
      refreshLogs();
    }
  });

  /* ---------- 轮询（智能：不打断正在编辑的输入框） ---------- */

  /** 是否有输入框正在编辑（轮询跳过，避免打断） */
  function isEditing() {
    var el = document.activeElement;
    return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT");
  }

  function refreshAll() {
    refreshStatus();
    // 用户列表轮询时若正在编辑输入框则跳过（不打断输入）
    if (!isEditing()) refreshUsers();
  }

  refreshAll();
  setInterval(refreshAll, 10000);
  // 统计/日志低频刷新（30s）
  setInterval(function () {
    refreshStats();
    refreshLogs();
  }, 30000);
  setTimeout(function () {
    refreshStats();
    refreshLogs();
  }, 500);

  /* ---------- 全局快捷键 ---------- */
  var SHORTCUT_TABS = ["overview", "chars", "mails", "pools", "api", "official", "pixel", "raw"];
  document.addEventListener("keydown", function (e) {
    if (isEditing() || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "/" || e.key === "u") {
      e.preventDefault();
      var f = $("user-filter");
      if (f) f.focus();
      return;
    }
    if (e.key === "r") {
      refreshAll();
      toast("已刷新", "info");
      return;
    }
    if (e.key >= "1" && e.key <= "7") {
      var t = SHORTCUT_TABS[Number(e.key) - 1];
      if (t && t !== currentTab) switchTab(t);
    }
  });

  /* ---------- 响应区复制按钮 ---------- */

  /** 给响应容器挂「复制」按钮（读取容器文本复制） */
  function attachCopy(containerId) {
    var box = $(containerId);
    if (!box) return;
    var wrap = box.parentNode;
    wrap.style.position = "relative";
    var old = wrap.querySelector(".copy-btn");
    if (old) old.remove();
    var btn = document.createElement("button");
    btn.className = "btn-sm copy-btn";
    btn.textContent = "复制";
    btn.style.cssText = "position:absolute;top:6px;right:6px;z-index:5;";
    wrap.insertBefore(btn, box);
    btn.addEventListener("click", function () {
      copyText(box.textContent);
    });
  }

  /** 响应区统一展示（设置内容 + 挂复制按钮） */
  function showResp(containerId, text) {
    $(containerId).textContent = text;
    attachCopy(containerId);
  }

  /* ---------- 主题切换 / 骨架屏 / 状态色 ---------- */

  /** 自定义确认弹窗（替换原生 confirm，统一主题；危险操作保留确认） */
  function confirmDialog(msg, onOk, title) {
    $("confirm-title").textContent = title || "确认操作";
    $("confirm-msg").textContent = msg;
    $("confirm-ok").onclick = function () {
      hideModal("modal-confirm");
      onOk();
    };
    $("confirm-cancel").onclick = function () { hideModal("modal-confirm"); };
    showModal("modal-confirm");
  }
  $("confirm-cancel").addEventListener("click", function () { hideModal("modal-confirm"); });

  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    var btn = $("theme-btn");
    if (btn) btn.textContent = t === "light" ? "深色" : "浅色";
    localStorage.setItem("adminTheme", t);
  }
  var savedTheme = localStorage.getItem("adminTheme");
  if (savedTheme) applyTheme(savedTheme);
  $("theme-btn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    applyTheme(cur);
  });

  /** 内容区骨架占位 */
  function setSkeleton(id) {
    var el = $(id);
    if (el) el.innerHTML = '<div class="skeleton">加载中...</div>';
  }

  /** 干员星级色 */
  function starColor(r) {
    return r >= 5 ? "var(--gold)" : r === 4 ? "var(--star5)" : r === 3 ? "var(--star4)" : "var(--muted)";
  }
})();
</script>
</body>
</html>
